{% extends "base.html" %}
{% block page_title %}Sign in — DOB Team Hub{% endblock %}
{% block guest_content %}
<div class="min-h-screen flex items-center justify-center bg-[#F5F8FA] px-4">
    <div class="w-full max-w-sm bg-white border border-[#E7ECF1] rounded-xl shadow-sm p-8">
        <div class="flex items-center gap-2.5 mb-6">
            <div class="w-9 h-9 rounded-[9px] bg-[#00C4B4] flex items-center justify-center font-bold text-[#0A1628] text-[16px]">D</div>
            <div>
                <div class="text-[15px] font-semibold leading-tight">DOB Team Hub</div>
                <div class="text-[11px] text-[#5B6B82]">Employee &amp; Task Management</div>
            </div>
        </div>

        {% if form.errors %}
        <div class="mb-4 px-3 py-2.5 rounded-lg text-sm bg-[#FCE8E7] text-[#B23934] border border-[#E8615C]/30">
            Incorrect username or password.
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label class="block text-[13px] font-medium text-[#5B6B82] mb-1.5" for="id_username">Username</label>
            <input class="w-full mb-4 text-[13.5px] px-3 py-2.5 rounded-lg border border-[#E7ECF1] focus:outline-none focus:ring-2 focus:ring-[#00C4B4]"
                   type="text" name="username" id="id_username" required autofocus>

            <label class="block text-[13px] font-medium text-[#5B6B82] mb-1.5" for="id_password">Password</label>
            <input class="w-full mb-6 text-[13.5px] px-3 py-2.5 rounded-lg border border-[#E7ECF1] focus:outline-none focus:ring-2 focus:ring-[#00C4B4]"
                   type="password" name="password" id="id_password" required>

            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="w-full bg-[#00C4B4] text-[#0A1628] font-semibold text-[13.5px] py-2.5 rounded-lg hover:opacity-90">
                Sign in
            </button>
        </form>
    </div>
</div>
{% endblock %}
