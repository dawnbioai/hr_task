{% extends "crm/base_crm.html" %}
{% block page_title %}Settings — DOB Campus CRM{% endblock %}
{% block topbar_title %}Settings{% endblock %}

{% block crm_content %}
<div class="card" style="max-width:480px;">
  <div class="card-header"><div class="card-title">System Settings</div></div>
  <div class="card-body" style="display:flex; flex-direction:column; gap:14px;">
    <div class="form-group"><div class="form-label">Organization</div><input class="form-input" value="Dawn of Bioinformatics Ltd."></div>
    <div class="form-group"><div class="form-label">Admin Email</div><input class="form-input" value="admin@dawnofbioinformatics.com"></div>
    <div class="form-group"><div class="form-label">Hot Lead Definition</div><input class="form-input" placeholder="e.g. Enrolled in training or bought a service"></div>
    <div class="form-group"><div class="form-label">Warm Lead Definition</div><input class="form-input" placeholder="e.g. Interested, contacted but not enrolled"></div>
    <div class="form-group"><div class="form-label">Cold Lead Definition</div><input class="form-input" placeholder="e.g. No response after 2 follow-ups"></div>
    <button class="btn btn-teal" style="align-self:flex-start;" onclick="showToast('Settings saved!')">Save Settings</button>
  </div>
</div>
{% endblock %}
