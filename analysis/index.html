<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analysis — DOB Team Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="app">
  <div id="sidebar-mount"></div>
  <main class="main">
    <div id="topbar-mount"></div>
    <div class="pages">
      <section class="page active">
        <div class="stat-strip" id="analysis-stats"></div>
        <div class="page-toolbar">
          <select id="analysis-division"></select>
          <select id="analysis-month"></select>
          <span class="toolbar-count" id="analysis-count"></span>
          <button class="btn-secondary" id="analysis-export">Download CSV</button>
        </div>
        <table class="data-table">
          <thead><tr><th>Employee</th><th>Completed</th><th>On-time</th><th>Late</th><th>Overdue now</th><th>On-time rate</th><th>Regularity</th></tr></thead>
          <tbody id="analysis-body"></tbody>
        </table>
        <p class="demo-note">Regular = no task currently overdue and at least half of completed tasks in the selected month finished by their due date.</p>
      </section>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>window.ROOT="../"; window.PAGE_ID="analysis"; window.PAGE_TITLE="Analysis"; window.PAGE_SUBTITLE="Who's finishing on time, who's falling behind";</script>
<script src="../assets/db.js"></script>
<script src="../assets/auth.js"></script>
<script src="../assets/nav.js"></script>
<script src="page.js"></script>
</body>
</html>
