<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Directory — DOB Team Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="app">
  <div id="sidebar-mount"></div>
  <main class="main">
    <div id="topbar-mount"></div>
    <div class="pages">
      <section class="page active" id="page-directory">
        <div class="stat-strip" id="directory-stats"></div>
        <div class="task-overview-grid" id="task-overview"></div>
        <div class="page-toolbar">
          <input type="search" id="directory-search" placeholder="Search by name, designation or department…">
          <span class="toolbar-count" id="directory-count"></span>
        </div>
        <div id="directory-groups"></div>
      </section>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>window.ROOT="../"; window.PAGE_ID="directory"; window.PAGE_TITLE="Employee Directory"; window.PAGE_SUBTITLE="Everyone's current task, grouped by division";</script>
<script src="../assets/db.js"></script>
<script src="../assets/auth.js"></script>
<script src="../assets/nav.js"></script>
<script src="page.js"></script>
</body>
</html>
